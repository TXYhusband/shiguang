name: Windows build
permissions:
  contents: read
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package:release
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Verify packaged desktop workflows
        run: |
          node tests/theme-default-desktop.cjs
          node tests/custom-planner-desktop.cjs
          node tests/accumulation-desktop.cjs
          node tests/public-v04-desktop.cjs
        env:
          STUDY_PACKAGED: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: StudyCompanion-Windows
          path: |
            release/*-portable.exe
            release/*-setup.exe
